<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <style>
        *{
            margin: 0px;
            box-sizing: border-box;
        }
    .a{
        height:100px;
        width:100px;
        border-radius: 90%; 
    }
    .b{
        background-color:rgb(61, 235, 13,0.5);
        width:20%; 
        margin: 0px auto;
        box-sizing: content-box;
        text-align: center;
        padding: 5px;
    }
</style>
</head>
<body>
    <div class="b">
    <h1>Profile card</h1>
    <img class="a" src="/p.jpg">
    <h3>Dhruvil Dave</h3>
    <p>Full Stack Developer</p>
    <p><b>Bio:</b>Aspiring FULL stack developer.</p><br>
    <button style="background-color:rgb(151, 82, 162);border: 2px solid rgb(151, 82, 162);color: white;padding: 10px; margin:0px;">Follow</button>
</div>
</body>
</html>
