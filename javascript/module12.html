<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        function divideNumbers(a, b) {
            try {
                if (b === 0) {
                    throw new Error("Division by zero is not allowed!"); 
                }
                let result = a / b;
                console.log(`Result: ${result}`);
            } 
            catch (error) {
                console.log("Error:", error.message); // Handle the error
            }
        }
        // Example calls
        divideNumbers(10, 2); 
        divideNumbers(5, 0);  

    </script>

</body>
</html>
